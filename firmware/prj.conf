# Diagnostics on the DevKitC UART connector; dashboard management is USB HID or BLE.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Native diagnostic shells. TCP is unauthenticated plaintext for trusted networks only.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="ESPForge> "
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_PROMPT_TELNET="ESPForge> "
CONFIG_SHELL_TELNET_PORT=2323
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=n
CONFIG_SHELL_TELNET_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL_INIT_CMD=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=n
# The kernel shell includes unguarded reboot and thread-control commands.
CONFIG_KERNEL_SHELL=n
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_FLASH_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_BT_SHELL=n

CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=73728
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# N16R8 module: 16 MB quad flash (DIO at 80 MHz) and 8 MB octal PSRAM, checked at boot.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_CLOCK_CONTROL=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_SENSOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# Native USB OTG: vendor HID and removable-media MSC, without CDC.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_SW_COEXIST_ENABLE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="ESPForge"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=25
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_GPIO=y
CONFIG_LED_STRIP=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
