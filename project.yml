:project:
  :name: ESPForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:paths:
  :test:
    - +:firmware/tests/**
  :source:
    - firmware/src/**
  :include:
    - firmware/src
    - firmware/src/**

:files:
  :source:
    - -:firmware/src/main.c
    - -:firmware/src/config/board.c
    - -:firmware/src/platform/boot_flash.c
    - -:firmware/src/platform/system_clock.c
    - -:firmware/src/app/telemetry.c
    - -:firmware/src/platform/storage.c
    - -:firmware/src/app/usb/usb_hid.c
    - -:firmware/src/app/wireless/bluetooth/ble.c
    - -:firmware/src/app/wireless/wifi/wifi.c

:cmock:
  :mock_prefix: mock_
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - return_thru_ptr
    - expect_any_args

:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
        - -Werror
