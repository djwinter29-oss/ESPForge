:project:
  :name: ESPForge Firmware Tests
  :ceedling_version: 1.1.10
  :build_root: build/ceedling
  :use_mocks: TRUE
  :release_build: FALSE

:paths:
  :test:
    - +:firmware/tests/**
  :source:
    - firmware/src
  :include:
    - firmware/src

:files:
  :source:
    - -:firmware/src/main.c
    - -:firmware/src/board.c
    - -:firmware/src/usb_hid.c
    - -:firmware/src/ble.c
    - -:firmware/src/wifi.c
    - -:firmware/src/telemetry.c
    - -:firmware/src/storage.c
    - -:firmware/src/boot_flash.c
    - -:firmware/src/system_clock.c

:cmock:
  :mock_prefix: mock_
  :when_ptr: :compare_ptr
  :plugins:
    - ignore
    - ignore_arg
    - return_thru_ptr
    - expect_any_args

:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
        - -Werror
