[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "espforge"
dynamic = ["version"]
description = "ESPForge USB HID control, diagnostics, and local dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ji Dong"}]
keywords = ["espforge", "esp32-s3", "zephyr", "usb", "hid", "wifi", "ble"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["Flask==3.1.3", "hidapi==0.15.0"]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/ESPForge"
Documentation = "https://github.com/djwinter29-oss/ESPForge/tree/main/host/python#readme"
Source = "https://github.com/djwinter29-oss/ESPForge"
Releases = "https://github.com/djwinter29-oss/ESPForge/releases"
Issues = "https://github.com/djwinter29-oss/ESPForge/issues"

[project.scripts]
espforge = "espforge.cli:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
root = "../.."
fallback_root = "."
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[tool.hatch.build]
artifacts = ["src/espforge/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/espforge"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pyright]
include = ["src/espforge/dashboard/boards.py", "src/espforge/dashboard/models.py",
           "src/espforge/dashboard/monitor.py", "tests/types/command_types.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
