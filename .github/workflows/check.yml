name: Software checks
on: [push, pull_request, workflow_dispatch]

jobs:
  firmware-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ceedling test:all
  hosts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install -r host/python/requirements.txt
      - run: python -m unittest discover -s host/python/tests -v
      - run: node --test host/web/tests/*.test.js
      - run: dotnet build host/dotnet/ESPForge
      - run: dotnet run --project host/dotnet/ESPForge.Tests
      - run: python tools/check_dotnet_serial.py
      - run: python tools/check_docs.py
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: espforge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gperf device-tree-compiler
      - run: |
          python -m pip install west
          west init -l espforge
          west update --narrow -o=--depth=1
          python -m pip install -r zephyr/scripts/requirements-base.txt
          west blobs fetch hal_espressif
          west sdk install --version 0.17.2 --toolchains xtensa-espressif_esp32s3_zephyr-elf
          bash espforge/tools/firmware/build.sh
          python espforge/tools/check_firmware_config.py
      - uses: actions/upload-artifact@v4
        with:
          name: espforge-esp32s3-software-build
          include-hidden-files: true
          path: |
            espforge/build/firmware/zephyr/zephyr.bin
            espforge/build/firmware/zephyr/zephyr.elf
            espforge/build/firmware/zephyr/.config
            espforge/build/firmware/zephyr/zephyr.dts
