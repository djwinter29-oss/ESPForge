name: Host Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python host package and test tools
        run: python -m pip install --disable-pip-version-check --no-input --editable host/python -r host/python/tests/requirements.txt

      - name: Run Python host tests
        run: python -m unittest discover -s host/python/tests -v

      - name: Type-check Python host
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        working-directory: host/python
        run: pyright

      - name: Verify installed Python wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          mkdir -p host/python/src/espforge/web
          cp -R host/web/src/. host/python/src/espforge/web/
          python -m pip wheel --no-deps host/python --wheel-dir build/wheels
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install build/wheels/*.whl
          build/wheel-check/bin/python -I tools/check_python_wheel.py

      - name: Setup Node.js
        if: matrix.python == '3.12'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Run shared bridge dashboard tests
        if: matrix.python == '3.12'
        run: node host/web/tests/run-tests.mjs

      - name: Run Direct dashboard tests
        if: matrix.python == '3.12'
        run: |
          node host/direct/tests/run-tests.mjs
          python -m unittest host.direct.tests.test_server -v

      - name: Type-check dashboards
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          npx --yes --package typescript@5.9.3 tsc --project host/web/tsconfig.json
          npx --yes --package typescript@5.9.3 tsc --project host/direct/web/js/tsconfig.json

      - name: Setup .NET
        if: matrix.python == '3.12'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Build and test .NET host
        if: matrix.python == '3.12'
        run: dotnet test host/dotnet/ESPForge.Tests

  dashboard-browser:
    name: Dashboard browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --editable host/python \
            -r host/direct/tests/browser/requirements.txt -r host/web/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Direct browser checks
        run: python host/direct/tests/browser/run.py

      - name: Run shared dashboard browser checks
        run: python host/web/tests/browser/run.py

  firmware-unit:
    name: Firmware unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby and locked gems
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Ceedling
        run: |
          bundle exec ceedling test:all
          bundle exec ceedling --mixin '={project: {build_root: build/ceedling-sd-spi}, defines: {test: [EF_STORAGE_SPI=1, EF_ENABLE_STORAGE_BENCHMARK=1]}}' test:test_hid_reports

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check documentation
        run: python tools/check_docs.py
