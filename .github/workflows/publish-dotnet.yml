name: Publish .NET Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Standalone host (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - name: Checkout package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || format('v{0}', inputs.version) }}
        run: |
          version=$(bash tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python for archive validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Publish self-contained host
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: >-
          dotnet publish host/dotnet/ESPForge/ESPForge.csproj -c Release -r "$RID" --self-contained true
          -p:MinVerVersionOverride="$VERSION" -p:RestorePackagesPath="$PWD/build/nuget/"
          -p:PublishDir="$PWD/build/host-release/"

      - name: Archive and smoke-test extracted host without hardware
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: python tools/release/package-dotnet.py

      - name: Attach standalone package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-host-${{ matrix.rid }}
          path: build/packages/*
          if-no-files-found: error
