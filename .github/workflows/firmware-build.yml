name: Firmware build

on:
  workflow_call:
    inputs:
      version:
        description: Release firmware version; empty uses the source default
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Optional firmware version in MAJOR.MINOR.PATCH form
        type: string
        default: ""

permissions:
  contents: read

jobs:
  firmware:
    name: Zephyr ESP32-S3-DevKitC (PROCPU, ${{ matrix.storage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - storage: sdmmc
            build: firmware
          - storage: sd-spi
            build: firmware-sd-spi
    env:
      ESPFORGE_VERSION: ${{ inputs.version }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      STORAGE: ${{ matrix.storage }}
      FIRMWARE_BUILD: espforge/build/${{ matrix.build }}
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: espforge
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Use source commit timestamp for build dates
        run: echo "SOURCE_DATE_EPOCH=$(git -C espforge show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gperf device-tree-compiler xz-utils

      - name: Initialize pinned Zephyr workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check --no-input west
          west init -l espforge
          west update --narrow -o=--depth=1
          python -m pip install --disable-pip-version-check --no-input -r zephyr/scripts/requirements-base.txt \
            -r modules/hal/espressif/zephyr/requirements.txt
          west blobs fetch hal_espressif
          west sdk install --version 0.17.4 --toolchains xtensa-espressif_esp32s3_zephyr-elf \
            --personal-access-token "$GH_TOKEN"

      - name: Build and check required defaults
        run: |
          bash espforge/tools/firmware/build.sh --storage "$STORAGE"
          python espforge/tools/check_firmware_config.py --storage "$STORAGE"
          west manifest --freeze > "$FIRMWARE_BUILD/west-manifest.yml"

      - name: Collect firmware, provenance and dependency licenses
        run: bash espforge/tools/release/package-firmware.sh

      - name: Attach software build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: espforge-esp32s3-${{ matrix.storage }}-software-build
          path: espforge/build/firmware-package/
          include-hidden-files: true
          if-no-files-found: error
