name: Release build packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Base tag in vMAJOR.MINOR.PATCH form; preflight creates no tag or release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate stable release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            test "$RELEASE_REF_TYPE" = tag
          fi
          version=$(bash tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host-validation:
    needs: validate-tag
    uses: ./.github/workflows/host-validation.yml

  firmware:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/firmware-build.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  dotnet:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  dashboards:
    name: Direct and Python source packages
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python host dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r host/python/requirements.txt

      - name: Package and check extracted dashboards
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          Path("build/packages").mkdir(parents=True, exist_ok=True)
          for kind in ("direct", "python"):
              root = Path("build") / f"{kind}-release"
              shutil.copytree(f"host/{kind}", root / "host" / kind,
                              ignore=shutil.ignore_patterns("__pycache__"))
              shutil.copytree("host/web", root / "host/web",
                              ignore=shutil.ignore_patterns("tests", "__pycache__"))
              shutil.copytree("docs", root / "docs")
              shutil.copyfile("LICENSE", root / "LICENSE")
              if kind == "direct":
                  (root / "tools/host").mkdir(parents=True)
                  shutil.copyfile("tools/host/run-direct.sh", root / "tools/host/run-direct.sh")
                  instructions = ("Run: bash tools/host/run-direct.sh --port 8000\n"
                                  "Open: http://127.0.0.1:8000/host/direct/\n")
              else:
                  instructions = (
                      "Install: python -m pip install -r host/python/requirements.txt\n"
                      "Run: python host/python/server.py --demo (SIMULATED) or --device PORT\n"
                      "Open: http://127.0.0.1:8001/\n"
                      "This is a source application, not an installable PyPI package.\n")
              (root / "RELEASE.txt").write_text(
                  f"ESPForge {version}\nSource: {os.environ['SOURCE_SHA']}\n{instructions}"
                  "Software checks do not qualify physical UART, Wi-Fi, BLE or SD behavior.\n",
                  encoding="utf-8")
              suffix = "-source" if kind == "python" else ""
              archive = shutil.make_archive(f"build/packages/espforge-{kind}-v{version}{suffix}",
                                            "zip", root_dir=root)
              with tempfile.TemporaryDirectory() as directory:
                  shutil.unpack_archive(archive, directory)
                  with socket.socket() as listener:
                      listener.bind(("127.0.0.1", 0))
                      port = listener.getsockname()[1]
                  command = ([sys.executable, "-m", "http.server", str(port), "--bind", "127.0.0.1"]
                             if kind == "direct" else
                             [sys.executable, "host/python/server.py", "--demo", "--port", str(port)])
                  process = subprocess.Popen(command, cwd=directory)
                  route = "/host/direct/" if kind == "direct" else "/"
                  asset_prefix = "/host/web/" if kind == "direct" else "/"
                  try:
                      for attempt in range(100):
                          assert process.poll() is None, f"{kind} server exited before readiness"
                          try:
                              with urllib.request.urlopen(f"http://127.0.0.1:{port}{route}", timeout=1) as response:
                                  assert b"ESPForge" in response.read()
                              break
                          except urllib.error.URLError:
                              time.sleep(0.1)
                      else:
                          raise RuntimeError(f"{kind} dashboard did not become ready")
                      for path in (Path(directory) / "host/web").iterdir():
                          if not path.is_file() or path.suffix not in (".html", ".js", ".css"):
                              continue
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}{asset_prefix}{path.name}", timeout=2) as response:
                              assert response.read() == path.read_bytes(), path.name
                      if kind == "python":
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/host", timeout=2) as response:
                              assert json.load(response) == {"name": "Python", "demo": True}
                          request = urllib.request.Request(
                              f"http://127.0.0.1:{port}/api/request", data=b'{"op":"status"}',
                              headers={"Content-Type": "application/json"})
                          with urllib.request.urlopen(request, timeout=2) as response:
                              reply = json.load(response)
                              assert reply["ok"] is True and reply["status"]["product"] == "ESPForge"
                  finally:
                      if process.poll() is None:
                          process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=10)
          PY

      - name: Attach dashboard source packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dashboards
          path: build/packages/*.zip
          if-no-files-found: error

  release:
    name: Publish verified GitHub release assets
    needs: [validate-tag, firmware, dotnet, dashboards]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download firmware build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: espforge-esp32s3-software-build
          path: build/firmware-package

      - name: Download dashboard packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/packages
          merge-multiple: true

      - name: Archive firmware and checksum all release assets
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          (cd build/firmware-package && zip -r "../packages/espforge-firmware-v$VERSION-esp32s3-devkitc.zip" .)
          cd build/packages
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Publish software-only GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ESPForge ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Software-only ESP32-S3-DevKitC N8 / 8 MB release, built with pinned Zephyr dependencies.
            Firmware and host packages include source provenance and license notices.
            Direct and Python archives retain the shared dashboard; .NET hosts are self-contained.

            **Not hardware-qualified:** firmware has not been flashed by this workflow.
            Physical UART, Wi-Fi, BLE and SD-card behavior remain unverified. SD testing is deferred.
            Read the included flashing instructions and qualification gaps before using hardware.
          files: build/packages/*
          fail_on_unmatched_files: true
