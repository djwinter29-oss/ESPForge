name: Release build packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Base tag in vMAJOR.MINOR.PATCH form; preflight creates no tag or release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate stable release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            test "$RELEASE_REF_TYPE" = tag
          fi
          version=$(bash tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host-validation:
    needs: validate-tag
    uses: ./.github/workflows/host-validation.yml

  firmware:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/firmware-build.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  dotnet:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  python:
    name: Python wheel
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Stage dashboard assets and build wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: bash tools/release/build-wheel.sh

      - name: Verify installed wheel and bundled dashboard
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: bash tools/release/check-wheel.sh

      - name: Attach Python wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/*.whl
          if-no-files-found: error

  dashboards:
    name: Direct dashboard package
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Package and check extracted Direct dashboard
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/release/package-direct.py

      - name: Attach Direct dashboard package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dashboards
          path: build/packages/*.zip
          if-no-files-found: error

  release:
    name: Publish verified GitHub release assets
    needs: [validate-tag, firmware, python, dotnet, dashboards]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download firmware build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: espforge-esp32s3-*-software-build
          path: build/firmware-packages

      - name: Download dashboard packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/packages
          merge-multiple: true

      - name: Archive firmware and checksum all release assets
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: bash tools/release/archive.sh

      - name: Publish software-only GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ESPForge ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Software-only ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM) release, built with pinned Zephyr dependencies.
            Firmware and host packages include source provenance and license notices.
            Separate SDMMC and SD-over-SPI firmware archives are provided; use the matching wiring.
            The Direct archive is standalone; the Python wheel bundles the shared dashboard; .NET hosts are self-contained.

            **Not hardware-qualified:** firmware has not been flashed by this workflow.
            Physical USB HID, Wi-Fi, BLE and SD-card behavior remain unverified. SD testing is deferred.
            Read the included flashing instructions and qualification gaps before using hardware.
          files: build/packages/*
          fail_on_unmatched_files: true
