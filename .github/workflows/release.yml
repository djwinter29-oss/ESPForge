name: Release build packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Base tag in vMAJOR.MINOR.PATCH form; preflight creates no tag or release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate stable release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            test "$RELEASE_REF_TYPE" = tag
          fi
          version=$(bash tools/firmware/release-version.sh "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host-validation:
    needs: validate-tag
    uses: ./.github/workflows/host-validation.yml

  firmware:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/firmware-build.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  dotnet:
    needs: [validate-tag, host-validation]
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  python:
    name: Python wheel
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set release package version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          for filename, field in (
              ("host/python/pyproject.toml", "version"),
              ("host/python/src/espforge/__init__.py", "DEFAULT_VERSION"),
          ):
              path = Path(filename)
              text, count = re.subn(rf'^{field} = "[^"]+"$', f'{field} = "{os.environ["VERSION"]}"',
                                    path.read_text(), flags=re.MULTILINE)
              assert count == 1, f"Expected one {field} in {path}"
              path.write_text(text)
          PY

      - name: Build wheel
        run: |
          cp LICENSE host/python/LICENSE
          python -m pip wheel --disable-pip-version-check --no-deps host/python --wheel-dir dist

      - name: Verify installed wheel and bundled dashboard
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python -m venv build/wheel-check
          build/wheel-check/bin/python -m pip install --disable-pip-version-check dist/*.whl
          build/wheel-check/bin/python -I tools/check_python_wheel.py "$VERSION"

      - name: Attach Python wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/*.whl
          if-no-files-found: error

  dashboards:
    name: Direct dashboard package
    needs: [validate-tag, host-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Package and check extracted Direct dashboard
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          Path("build/packages").mkdir(parents=True, exist_ok=True)
          footer = "Software checks do not qualify physical USB HID, Wi-Fi, BLE or SD behavior.\n"

          # ESPForge Direct is standalone: its own web/, server.py and LICENSE.
          direct = Path("build/direct-release")
          shutil.copytree("host/direct/web", direct / "web")
          shutil.copyfile("host/direct/server.py", direct / "server.py")
          shutil.copyfile("LICENSE", direct / "LICENSE")
          index = direct / "web/index.html"
          html = index.read_text(encoding="utf-8")
          assert html.count("App v0.0.0-debug<") == 1, "Direct version placeholder missing"
          index.write_text(html.replace("App v0.0.0-debug<", f"App v{version}<"), encoding="utf-8")
          (direct / "RELEASE.txt").write_text(
              f"ESPForge {version}\nSource: {os.environ['SOURCE_SHA']}\n"
              "Run: python3 server.py --port 8000\nOpen: http://127.0.0.1:8000/ in desktop Chrome or Edge\n"
              + footer, encoding="utf-8")
          shutil.make_archive(f"build/packages/espforge-direct-v{version}", "zip", root_dir=direct)

          def free_port():
              with socket.socket() as listener:
                  listener.bind(("127.0.0.1", 0))
                  return listener.getsockname()[1]

          def fetch(url):
              with urllib.request.urlopen(url, timeout=2) as response:
                  return response.headers, response.read()

          def smoke(archive, command, web, check):
              with tempfile.TemporaryDirectory() as directory:
                  shutil.unpack_archive(archive, directory)
                  port = free_port()
                  process = subprocess.Popen([sys.executable, *command, "--port", str(port)], cwd=directory)
                  origin = f"http://127.0.0.1:{port}"
                  try:
                      for attempt in range(100):
                          assert process.poll() is None, f"{archive} server exited before readiness"
                          try:
                              assert b"ESPForge" in fetch(f"{origin}/")[1]
                              break
                          except urllib.error.URLError:
                              time.sleep(0.1)
                      else:
                          raise RuntimeError(f"{archive} dashboard did not become ready")
                      root = Path(directory) / web
                      for path in sorted(root.rglob("*")):
                          if path.is_file():
                              relative = path.relative_to(root).as_posix()
                              assert fetch(f"{origin}/{relative}")[1] == path.read_bytes(), relative
                      check(origin, Path(directory))
                  finally:
                      if process.poll() is None:
                          process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=10)

          def check_direct(origin, directory):
              assert sorted(path.name for path in directory.iterdir()) == ["LICENSE", "RELEASE.txt", "server.py", "web"]
              headers, body = fetch(f"{origin}/")
              assert f"App v{version}<".encode() in body
              assert "default-src 'self'" in headers["Content-Security-Policy"]
              assert fetch(f"{origin}/favicon.svg")[0]["Content-Type"].startswith("image/svg+xml")
              assert fetch(f"{origin}/js/app.mjs")[0]["Content-Type"].startswith("text/javascript")

          smoke(f"build/packages/espforge-direct-v{version}.zip", ["server.py"], "web", check_direct)
          PY

      - name: Attach Direct dashboard package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dashboards
          path: build/packages/*.zip
          if-no-files-found: error

  release:
    name: Publish verified GitHub release assets
    needs: [validate-tag, firmware, python, dotnet, dashboards]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download firmware build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: espforge-esp32s3-software-build
          path: build/firmware-package

      - name: Download dashboard packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/packages
          merge-multiple: true

      - name: Archive firmware and checksum all release assets
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          (cd build/firmware-package && zip -r "../packages/espforge-firmware-v$VERSION-esp32s3-devkitc.zip" .)
          cd build/packages
          sha256sum *.zip *.tar.gz *.whl > SHA256SUMS.txt

      - name: Publish software-only GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ESPForge ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Software-only ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM) release, built with pinned Zephyr dependencies.
            Firmware and host packages include source provenance and license notices.
            The Direct archive is standalone; the Python wheel bundles the shared dashboard; .NET hosts are self-contained.

            **Not hardware-qualified:** firmware has not been flashed by this workflow.
            Physical USB HID, Wi-Fi, BLE and SD-card behavior remain unverified. SD testing is deferred.
            Read the included flashing instructions and qualification gaps before using hardware.
          files: build/packages/*
          fail_on_unmatched_files: true
